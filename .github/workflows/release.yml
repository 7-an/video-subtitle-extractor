name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/page.js
          node --check extension/popup.js
          python3 -m unittest discover -s native-host/tests
      - name: Build archive
        run: bash scripts/build-release.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --generate-notes --title "TubeCaption Local $GITHUB_REF_NAME"
          fi
